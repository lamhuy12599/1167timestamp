<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Camera 7-Eleven</title>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --brand-green: #008062;
            --brand-orange: #F37021;
            --bg-main: #F4F5F7;
            --bg-card: #ffffff;
            --text-main: #333;
            --text-muted: #666;
            --border-color: rgba(0,0,0,0.08);

            --glass-fill: rgba(255,255,255,0.14);
            --glass-fill-strong: rgba(255,255,255,0.22);
            --glass-border: rgba(255,255,255,0.4);
            --glass-border-soft: rgba(255,255,255,0.16);
            --glass-shadow: 0 8px 28px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.2);

            --panel-fill: rgba(255,255,255,0.62);
            --panel-border: rgba(255,255,255,0.65);
        }

        [data-theme="dark"] {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f1f1f1;
            --text-muted: #aaa;
            --border-color: rgba(255,255,255,0.1);
            --panel-fill: rgba(30,30,34,0.6);
            --panel-border: rgba(255,255,255,0.16);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: #000;
        }

        body { color: var(--text-main); }

        .app-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #000;
            overflow: hidden;
        }

        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .top-gradient {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 140px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
            pointer-events: none;
            z-index: 3;
        }

        .glass {
            background: var(--glass-fill);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--glass-border-soft);
            border-top-color: var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -1px 0 rgba(255,255,255,0.04);
            position: relative;
        }

        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 999; /* Tăng cực cao để không bị đè */
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top) + 12px) 14px 10px;
        }

        .brand-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 16px 5px 6px;
            border-radius: 999px;
            overflow: hidden;
        }
        .brand-pill span { color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.2px; text-shadow: 0 1px 3px rgba(0,0,0,0.35); }
        .brand-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; flex-shrink: 0; }
        .brand-pill .dot.err { background: #e74c3c; }
        .brand-pill .dot.pending { background: #f1c40f; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease;
            pointer-events: auto;
        }
        .icon-btn:active { transform: scale(0.9); }

        /* CĂN CHỈNH LẠI CHỮ: Nhỏ hơn và ép về góc trái */
        .timestamp-overlay {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom) + 120px);
            left: 14px;
            max-width: 80vw; /* Giới hạn để chữ không tràn hết màn hình */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-family: 'Share Tech Mono', monospace;
            color: #FFF;
            pointer-events: none;
            line-height: 1.25;
            text-shadow:
                -1.2px -1.2px 0 #000, 1.2px -1.2px 0 #000,
                -1.2px  1.2px 0 #000, 1.2px  1.2px 0 #000,
                 0px    1.2px 0 #000, 0px   -1.2px 0 #000,
                 1.2px  0px 0 #000, -1.2px  0px 0 #000;
            z-index: 5;
        }

        /* GIAO DIỆN LOGO 7-ELEVEN BÊN TRÁI MÀN HÌNH */
        .ui-logo-box {
            width: 46px;
            height: 40px;
            background: #fff;
            border: 2px solid #008062;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-shadow: none; /* Reset text shadow cho logo */
        }
        .ui-logo-box .seven {
            color: #ed2939; font-size: 26px; font-weight: 900; 
            line-height: 0.9; font-family: Arial, sans-serif; letter-spacing: -1px;
        }
        .ui-logo-box .eleven {
            color: #008062; font-size: 7px; font-weight: 900; 
            line-height: 1; font-family: Arial, sans-serif; margin-top: 1px;
        }

        #timestamp { font-size: 0.75rem; font-weight: bold; letter-spacing: 0.2px; }
        #address { font-size: 0.55rem; font-weight: bold; margin-top: 3px; letter-spacing: 0.2px; word-wrap: break-word; }

        .flash-overlay { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }

        .controls-bar {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            padding: 16px 34px calc(env(safe-area-inset-bottom) + 26px);
        }

        .shutter-btn {
            width: 76px; height: 76px; border-radius: 50%; cursor: pointer; position: relative; flex-shrink: 0; padding: 5px;
            background: var(--glass-fill-strong);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid var(--glass-border-soft); border-top-color: var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.55);
            transition: transform 0.12s ease;
        }
        .shutter-btn::after {
            content: ''; position: absolute; inset: 5px; border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #5aa, var(--brand-green) 60%, #005940 100%);
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.5), inset 0 -3px 6px rgba(0,0,0,0.25);
            transition: transform 0.12s ease, border-radius 0.12s ease;
        }
        .shutter-btn:active { transform: scale(0.95); }
        .shutter-btn:active::after { transform: scale(0.84); border-radius: 40%; }
        .shutter-btn[disabled] { opacity: 0.5; pointer-events: none; filter: grayscale(1); }

        .thumb-btn {
            width: 48px; height: 48px; border-radius: 16px; color: #fff; font-size: 19px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 0.15s ease;
        }
        .thumb-btn:active { transform: scale(0.9); }
        .ghost-slot { width: 48px; height: 48px; visibility: hidden; flex-shrink: 0; }

        .sheet-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 1000;
        }
        .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

        .settings-sheet {
            position: fixed; left: 10px; right: 10px; bottom: 0; z-index: 1001;
            color: var(--text-main); border-radius: 28px 28px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom) + 18px);
            max-height: 85vh; overflow-y: auto; background: var(--panel-fill);
            backdrop-filter: blur(34px) saturate(190%); -webkit-backdrop-filter: blur(34px) saturate(190%);
            border: 1px solid var(--panel-border); border-bottom: none;
            box-shadow: 0 -16px 44px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6);
            transform: translateY(115%); transition: transform 0.35s cubic-bezier(.32,.9,.4,1);
        }
        .settings-sheet.show { transform: translateY(0); }

        .sheet-handle { width: 38px; height: 5px; border-radius: 3px; background: var(--text-muted); opacity: 0.4; margin: 6px auto 14px; }
        .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .sheet-header h3 { color: var(--brand-green); font-size: 17px; font-weight: 800; }
        .close-btn {
            width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--glass-border-soft);
            background: rgba(128,128,128,0.18); backdrop-filter: blur(10px);
            font-size: 15px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .input-group label { font-size: 13px; font-weight: bold; margin-left: 4px; }
        .input-group input {
            width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-color);
            background: rgba(128,128,128,0.08); color: var(--text-main); font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: var(--brand-green); }

        .status-row { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 16px; margin-bottom: 6px; }
        .status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: rgba(128,128,128,0.10); }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #2ecc71; flex-shrink: 0; }
        .status-dot.pending { background: #f1c40f; animation: pulse 1.2s infinite; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="app-container" id="cameraWrapper">
    <video id="video" autoplay playsinline muted></video>
    <div class="top-gradient"></div>

    <div class="top-bar">
        <div class="brand-pill glass">
            <span class="dot pending" id="gpsDot"></span>
            <span id="brandLabel">Đang lấy vị trí…</span>
        </div>
        <!-- Thêm id cứng và sự kiện trực tiếp để chống kẹt chạm trên iOS -->
        <button class="icon-btn glass" id="settingsBtn" aria-label="Cài đặt"><span>⚙️</span></button>
    </div>

    <div class="timestamp-overlay">
        <!-- Logo 7-Eleven góc trái -->
        <div class="ui-logo-box">
            <div class="seven">7</div>
            <div class="eleven">ELEVEn</div>
        </div>
        <div id="timestamp">--:--:--</div>
        <div id="address">Đang lấy vị trí GPS…</div>
    </div>

    <div class="flash-overlay" id="flashOverlay"></div>

    <div class="controls-bar">
        <button class="thumb-btn glass" id="uploadTrigger" aria-label="Đóng dấu ảnh có sẵn"><span>🖼️</span></button>
        <button class="shutter-btn" id="snapBtn" aria-label="Chụp ảnh" disabled></button>
        <div class="ghost-slot"></div>
    </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display: none;">
<canvas id="canvas"></canvas>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="settings-sheet" id="settingsSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <h3>Cài đặt hiển thị</h3>
        <button class="close-btn" id="closeSettings" aria-label="Đóng">✕</button>
    </div>

    <div class="input-group">
        <label>Thời gian (Tuỳ chỉnh):</label>
        <input type="text" id="customTimeInput" placeholder="VD: 2026-09-15 08:30:00 (Để trống lấy tự động)">
    </div>
    
    <div class="input-group">
        <label>Địa điểm (Tuỳ chỉnh):</label>
        <input type="text" id="customAddressInput" placeholder="Nhập địa chỉ muốn thay đổi... (Để trống lấy tự động)">
    </div>

    <div class="status-row">
        <div class="status-line"><span class="status-dot" id="timeDot"></span> Nguồn giờ: <b id="timeStatus">Hệ thống (Tự động)</b></div>
        <div class="status-line"><span class="status-dot pending" id="gpsStatusDot"></span> Nguồn vị trí: <b id="gpsStatus">Đang xác định qua GPS…</b></div>
    </div>
</div>

<script>
    function getFormattedTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    function triggerFlash() {
        const flash = document.getElementById('flashOverlay');
        flash.style.transition = 'none';
        flash.style.opacity = '0.85';
        requestAnimationFrame(() => {
            flash.style.transition = 'opacity 0.35s ease';
            flash.style.opacity = '0';
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const timestampDiv = document.getElementById('timestamp');
        const addressDiv = document.getElementById('address');
        const snapBtn = document.getElementById('snapBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadTrigger = document.getElementById('uploadTrigger');

        const gpsDot = document.getElementById('gpsDot');
        const gpsStatusDot = document.getElementById('gpsStatusDot');
        const gpsStatus = document.getElementById('gpsStatus');
        const brandLabel = document.getElementById('brandLabel');

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsSheet = document.getElementById('settingsSheet');
        const sheetBackdrop = document.getElementById('sheetBackdrop');
        const closeSettings = document.getElementById('closeSettings');
        
        const customTimeInput = document.getElementById('customTimeInput');
        const customAddressInput = document.getElementById('customAddressInput');

        let currentAddress = null;
        let currentCoords = null;

        // XỬ LÝ NÚT CÀI ĐẶT CHẮC CHẮN HOẠT ĐỘNG
        function openSettings(e) { 
            if(e) e.preventDefault(); 
            settingsSheet.classList.add('show'); 
            sheetBackdrop.classList.add('show'); 
        }
        function closeSettingsSheet(e) { 
            if(e) e.preventDefault();
            settingsSheet.classList.remove('show'); 
            sheetBackdrop.classList.remove('show'); 
        }

        if (settingsBtn) {
            settingsBtn.addEventListener('click', openSettings);
            // Thêm touchstart để giải quyết lỗi không phản hồi trên Safari iOS
            settingsBtn.addEventListener('touchstart', openSettings, {passive: false});
        }
        if (closeSettings) {
            closeSettings.addEventListener('click', closeSettingsSheet);
            closeSettings.addEventListener('touchstart', closeSettingsSheet, {passive: false});
        }
        if (sheetBackdrop) sheetBackdrop.addEventListener('click', closeSettingsSheet);

        function getActiveTime() { return customTimeInput.value.trim() || getFormattedTime(); }

        setInterval(() => { timestampDiv.innerText = getActiveTime(); }, 1000);

        customAddressInput.addEventListener('input', () => {
            const customVal = customAddressInput.value.trim();
            if (customVal) {
                gpsStatus.innerText = 'Tuỳ chỉnh thủ công';
                gpsStatusDot.className = 'status-dot';
                addressDiv.innerText = customVal;
                snapBtn.removeAttribute('disabled');
            } else if (currentAddress) {
                gpsStatus.innerText = 'GPS thực tế';
                gpsStatusDot.className = 'status-dot';
                addressDiv.innerText = `${currentAddress} (${currentCoords.lat.toFixed(5)}, ${currentCoords.lon.toFixed(5)})`;
                snapBtn.removeAttribute('disabled');
            }
        });

        // Hàm vẽ logo 7-11 bằng code (không bao giờ bị lỗi ảnh)
        function draw7ElevenLogo(ctx, x, y, size) {
            const width = size;
            const height = size * 0.88;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 8;
            
            ctx.fillStyle = '#ffffff';
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(x, y, width, height, size * 0.08);
                ctx.fill();
            } else {
                ctx.fillRect(x, y, width, height);
            }
            ctx.shadowBlur = 0;
            
            ctx.strokeStyle = '#008062';
            ctx.lineWidth = Math.max(2, size * 0.04);
            if (ctx.roundRect) ctx.stroke(); else ctx.strokeRect(x, y, width, height);
            
            ctx.fillStyle = '#ed2939';
            ctx.font = `900 ${size * 0.65}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('7', x + width * 0.5, y + height * 0.68);
            
            ctx.fillStyle = '#008062';
            ctx.font = `900 ${size * 0.17}px Arial, sans-serif`;
            ctx.fillText('ELEVEn', x + width * 0.5, y + height * 0.88);
            ctx.restore();
            return height;
        }

        async function drawWatermarkAndDownload(sourceElement, isVideoSource) {
            const finalAddress = customAddressInput.value.trim() || currentAddress;
            if (!finalAddress) return alert("Chưa có GPS. Vui lòng đợi hoặc nhập tay.");

            const imgW = isVideoSource ? sourceElement.videoWidth : sourceElement.naturalWidth;
            const imgH = isVideoSource ? sourceElement.videoHeight : sourceElement.naturalHeight;
            const ctx = canvas.getContext('2d');
            canvas.width = imgW; canvas.height = imgH;
            ctx.drawImage(sourceElement, 0, 0, canvas.width, canvas.height);

            const baseSize = Math.min(canvas.width, canvas.height);
            
            // THU NHỎ KÍCH THƯỚC CHỮ XUỐNG CÒN KHOẢNG 60% SO VỚI BẢN CŨ
            const padding = Math.floor(baseSize * 0.025);
            const fontSizeTime = Math.floor(baseSize * 0.022); 
            const fontSizeAddr = Math.floor(baseSize * 0.015);
            const finalTimeText = getActiveTime();

            ctx.strokeStyle = '#000000'; ctx.fillStyle = '#FFFFFF';
            ctx.lineJoin = 'round'; ctx.miterLimit = 2;

            // Tính toán toạ độ Y từ dưới lên (ép góc trái)
            const addrY = canvas.height - padding;
            const timeY = addrY - fontSizeAddr - Math.floor(baseSize * 0.012);
            
            // Vẽ Logo
            const logoSize = Math.floor(baseSize * 0.1); // Logo chiếm 10% chiều ngang
            const logoHeight = logoSize * 0.88;
            const logoY = timeY - fontSizeTime - logoHeight - Math.floor(baseSize * 0.012);
            
            draw7ElevenLogo(ctx, padding, logoY, logoSize);

            // Vẽ Chữ (Text)
            ctx.textAlign = 'left';

            ctx.font = `bold ${fontSizeAddr}px 'Share Tech Mono', monospace`;
            ctx.lineWidth = Math.max(2, Math.floor(fontSizeAddr * 0.15));
            ctx.strokeText(finalAddress, padding, addrY);
            ctx.fillText(finalAddress, padding, addrY);

            ctx.font = `bold ${fontSizeTime}px 'Share Tech Mono', monospace`;
            ctx.lineWidth = Math.max(3, Math.floor(fontSizeTime * 0.15));
            ctx.strokeText(finalTimeText, padding, timeY);
            ctx.fillText(finalTimeText, padding, timeY);

            canvas.toBlob((blob) => {
                if (!blob) return;
                const fileName = `7Eleven_Snap_${Date.now()}.jpg`;
                const file = new File([blob], fileName, { type: 'image/jpeg' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    navigator.share({ files: [file] }).catch(()=>{});
                } else {
                    const dl = document.createElement('a'); dl.download = fileName;
                    dl.href = URL.createObjectURL(blob); dl.click();
                }
            }, 'image/jpeg', 0.98);
        }

        function initGPS() {
            navigator.geolocation.watchPosition(
                async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    try {
                        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&accept-language=vi`;
                        const res = await fetch(url); const data = await res.json();
                        currentAddress = data.display_name || `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
                    } catch(e) { currentAddress = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`; }
                    
                    currentCoords = { lat: latitude, lon: longitude };
                    brandLabel.innerText = currentAddress; gpsDot.className = 'dot';
                    
                    if (!customAddressInput.value.trim()) {
                        gpsStatusDot.className = 'status-dot'; gpsStatus.innerText = 'GPS thực tế';
                        addressDiv.innerText = `${currentAddress} (${latitude.toFixed(5)}, ${longitude.toFixed(5)})`;
                        snapBtn.removeAttribute('disabled');
                    }
                },
                () => { if(!customAddressInput.value) snapBtn.setAttribute('disabled', 'true'); },
                { enableHighAccuracy: true }
            );
        }

        async function initCamera() {
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 4096 } } });
            } catch (err) {}
        }
        
        initGPS(); initCamera();

        if (snapBtn) snapBtn.addEventListener('click', () => { triggerFlash(); drawWatermarkAndDownload(video, true); });
        if (uploadTrigger) uploadTrigger.addEventListener('click', () => fileInput.click());
        if (fileInput) fileInput.addEventListener('change', (e) => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => { const img = new Image(); img.onload = () => drawWatermarkAndDownload(img, false); img.src = ev.target.result; };
            r.readAsDataURL(f);
        });
    });
</script>
</body>
</html>
